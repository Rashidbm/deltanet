<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeltaNet — work update on Apple Watch</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#ddd;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#stage{width:100%;height:100%;position:relative}canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .7s ease}body.ready canvas{opacity:1}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#7e7e86;font-size:12px;line-height:1.8;transition:opacity .3s ease}.fallback strong{color:#c4c4cd;font-size:18px;font-weight:500}.ready .fallback{opacity:0;pointer-events:none}.error .fallback{opacity:1}.error canvas{display:none}
.decision-receipt{position:absolute;bottom:6px;left:50%;width:280px;max-width:92%;padding:14px 17px;display:flex;gap:12px;align-items:center;border:1px solid #ffffff23;background:#202024ed;box-shadow:0 12px 32px #0003;border-radius:13px;opacity:0;pointer-events:none;transform:translate(-50%,8px)}.receipt-mark{width:27px;height:27px;border:1px solid #ffffff30;border-radius:50%;display:grid;place-items:center;color:#d8d8df;font-size:13px}.decision-receipt strong{font-size:12px;font-weight:500;color:#eee}.decision-receipt p{font-size:10px;color:#9797a3;margin:5px 0 0;line-height:1.5}body[data-phase="2"] .receipt-mark{color:#9696a3}@media(prefers-reduced-motion:reduce){canvas{transition:none}}
</style></head><body><div id="stage" role="img" aria-label="Apple Watch showing a DeltaNet notification: Review a decision, approve it, and see your agents resume work."><div class="fallback"><strong>Your call.</strong><span>Your agent has an update ready to approve.</span></div></div><div class="decision-receipt" aria-hidden="true"><span class="receipt-mark">✓</span><div><strong id="receipt-title">Approval received</strong><p id="receipt-detail">Noura’s agent is sending the update.</p></div></div><script type="module" src="./work-watch.js"></script></body></html>
